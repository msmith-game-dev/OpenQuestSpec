name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    # Only meaningful on pull requests: it checks the commits a PR proposes to add.
    # Unenforced DCO is theatre, and a provenance record with silent gaps is worse
    # than none because it looks complete (ADR-0014).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          failed=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format='%(trailers:key=Signed-off-by)' "$sha" | grep -q .; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") is missing a Signed-off-by trailer"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Sign off with 'git commit -s', or for an existing branch:"
            echo "  git rebase --signoff ${BASE}"
            echo "See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits signed off."

  corpus:
    name: Corpus (Ajv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema is a valid 2020-12 schema
        run: pnpm run corpus:meta
      - name: Every corpus case behaves as recorded
        run: pnpm run corpus

  cross-validator:
    name: Cross-implementation (check-jsonschema)
    runs-on: ubuntu-latest
    # The corpus job proves the schema works with Ajv. Ajv is also what @openquest/core
    # will use, so on its own it proves portability to exactly one implementation --
    # which is not the claim the specification makes. This job runs a validator from a
    # different language and a different codebase, so "any conforming validator" is
    # tested rather than asserted.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install check-jsonschema

      - name: Every corpus case behaves as recorded
        # Expected outcomes are read from the manifest, never restated here. An earlier
        # version hardcoded which cases were semantic; a case added later did not reach
        # that list and CI failed on a document that was behaving correctly. Anything
        # the manifest already knows must be read from it, not copied.
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          corpus = pathlib.Path("packages/schema/corpus")
          manifest = json.loads((corpus / "index.json").read_text())
          schema = (corpus / manifest["schema"]).resolve()

          def validates(path):
              return subprocess.run(
                  ["check-jsonschema", "--schemafile", str(schema), str(path)],
                  capture_output=True,
              ).returncode == 0

          failures = []
          for case in manifest["cases"]:
              # Semantic cases pass schema validation by design: the rules they break
              # cannot be expressed in JSON Schema at all.
              expect_pass = case["expect"] == "valid" or case.get("layer") == "semantic"
              if validates(corpus / case["file"]) != expect_pass:
                  failures.append((case["file"], expect_pass))

          for name in ("riverwood.json",):
              if not validates(pathlib.Path("examples") / name):
                  failures.append((f"examples/{name}", True))

          for name, expected in failures:
              want = "pass" if expected else "fail"
              print(f"::error file={name}::expected this document to {want} schema validation")

          total = len(manifest["cases"]) + 1
          if failures:
              print(f"\n{len(failures)} of {total} cases diverged from the manifest.")
              sys.exit(1)
          print(f"\nAll {total} cases behave as recorded, under a second implementation.")
          PY
